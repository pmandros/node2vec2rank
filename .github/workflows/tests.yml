name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Python 3.9 is not built for the newest runner image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install ".[test]"
      - name: Test
        run: pytest -q
